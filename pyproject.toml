[project]
name = "ouroboros-metrics"
dynamic = ["version"]
dependencies = ["influxdb-client[ciso]", "pytz"]

[project.scripts]
oexport = "oexport:main"

[tool.setuptools]
py-modules = ["ribreader", "oexport"]

[build-system]
requires = ["setuptools>=64", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
